<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Timeline & Find Me Tracker</title>
    
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome untuk ikon tombol -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #0f172a; overflow: hidden; }
        
        #map { flex: 1; width: 100%; z-index: 1; }

        /* Floating Modern Control Panel */
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
        }

        .stat-card {
            background: #f1f5f9;
            padding: 8px 4px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .stat-card span {
            display: block;
            font-size: 9px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-card strong {
            font-size: 13px;
            color: #1e293b;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-row-full {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active { transform: scale(0.97); }

        .btn-start { background: #10b981; color: white; }
        .btn-start:hover { background: #059669; }

        .btn-stop { background: #ef4444; color: white; }
        .btn-stop:hover { background: #dc2626; }

        .btn-fix { background: #3b82f6; color: white; }
        .btn-fix:hover { background: #2563eb; }

        .btn-find { background: #8b5cf6; color: white; }
        .btn-find:hover { background: #7c3aed; }

        button:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; transform: none; }

        #errorLog { color: #ef4444; font-size: 11px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel">
        <div id="errorLog"></div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span>JARAK</span>
                <strong id="totalDistance">0.00 km</strong>
            </div>
            <div class="stat-card">
                <span>AKURASI</span>
                <strong id="gpsAccuracy">0 m</strong>
            </div>
            <div class="stat-card">
                <span>TITIK</span>
                <strong id="pointCount">0</strong>
            </div>
            <div class="stat-card">
                <span>STATUS</span>
                <strong id="gpsStatus" style="color: #64748b;">Standby</strong>
            </div>
        </div>

        <div class="btn-group">
            <button id="btnStart" class="btn-start" onclick="startTracking()"><i class="fa-solid fa-play"></i> Mulai</button>
            <button id="btnStop" class="btn-stop" onclick="stopTracking()" disabled><i class="fa-solid fa-stop"></i> Berhenti</button>
        </div>

        <div class="btn-row-full">
            <button class="btn-find" onclick="findMe()"><i class="fa-solid fa-crosshairs"></i> Cari Saya (Find Me)</button>
            <button class="btn-fix" onclick="fixTrajectoryData()"><i class="fa-solid fa-wand-magic-sparkles"></i> Perbaiki Glitch</button>
        </div>
    </div>

    <!-- Leaflet.js JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let watchId = null;
        let rawPoints = [];
        let polylineLayer;
        let currentMarker;
        let accuracyCircle;
        let latestCoords = null; // Menyimpan posisi terakhir untuk fitur Find Me

        function initMap() {
            // Default center awal ke Medan, Sumatera Utara
            map = L.map('map', { zoomControl: false }).setView([3.5952, 98.6722], 16);

            // Pindahkan posisi kontrol zoom ke kanan atas agar bersih
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            polylineLayer = L.polyline([], { color: '#3b82f6', weight: 5, opacity: 0.8 }).addTo(map);
        }

        function startTracking() {
            document.getElementById('errorLog').innerText = "";

            if (!navigator.geolocation) {
                alert("Browser tidak mendukung Geolocation.");
                return;
            }

            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
            document.getElementById('gpsStatus').innerText = "Mencari...";
            document.getElementById('gpsStatus').style.color = "#f59e0b";

            const options = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            watchId = navigator.geolocation.watchPosition(
                onLocationSuccess,
                onLocationError,
                options
            );
        }

        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const timestamp = Date.now();

            latestCoords = { lat, lon }; // Update koordinat terkini

            document.getElementById('gpsStatus').innerText = "Aktif";
            document.getElementById('gpsStatus').style.color = "#10b981";
            document.getElementById('gpsAccuracy').innerText = Math.round(accuracy) + " m";

            if (accuracy > 50) {
                console.warn("Akurasi buruk (" + accuracy + "m), lewati.");
                return;
            }

            if (rawPoints.length > 0) {
                const last = rawPoints[rawPoints.length - 1];
                const moveDist = calculateHaversineDistance(last.lat, last.lon, lat, lon) * 1000;
                if (moveDist < 3) {
                    updateMapMarker(lat, lon, accuracy);
                    return;
                }
            }

            const newPoint = { lat, lon, timestamp, accuracy };
            rawPoints.push(newPoint);

            updateMapMarker(lat, lon, accuracy);
            renderPolylineAndDistance(rawPoints);
            
            // Auto pan ke posisi terkini
            map.panTo([lat, lon]);
            document.getElementById('pointCount').innerText = rawPoints.length;
        }

        // Fitur "Cari Saya" (Find Me) - Memusatkan peta ke lokasi terkini pengguna secara manual
        function findMe() {
            if (latestCoords) {
                map.setView([latestCoords.lat, latestCoords.lon], 18, { animate: true });
            } else {
                alert("Lokasi terkini belum ditemukan. Pastikan GPS sudah dimulai!");
            }
        }

        function updateMapMarker(lat, lon, accuracy) {
            if (currentMarker) {
                currentMarker.setLatLng([lat, lon]);
            } else {
                currentMarker = L.marker([lat, lon]).addTo(map);
            }

            if (accuracyCircle) {
                accuracyCircle.setLatLng([lat, lon]);
                accuracyCircle.setRadius(accuracy);
            } else {
                accuracyCircle = L.circle([lat, lon], {
                    radius: accuracy,
                    color: '#2563eb',
                    fillColor: '#3b82f6',
                    fillOpacity: 0.15
                }).addTo(map);
            }
        }

        function onLocationError(error) {
            let msg = "GPS Error: ";
            switch(error.code) {
                case error.PERMISSION_DENIED: msg += "Izin ditolak."; break;
                case error.POSITION_UNAVAILABLE: msg += "Sinyal tidak tersedia."; break;
                case error.TIMEOUT: msg += "Waktu habis."; break;
            }
            document.getElementById('errorLog').innerText = msg;
            document.getElementById('gpsStatus').innerText = "Gagal";
            document.getElementById('gpsStatus').style.color = "#ef4444";
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
            document.getElementById('gpsStatus').innerText = "Selesai";
            document.getElementById('gpsStatus').style.color = "#ef4444";
        }

        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function renderPolylineAndDistance(pointsArray) {
            const latLngs = pointsArray.map(p => [p.lat, p.lon]);
            polylineLayer.setLatLngs(latLngs);

            let totalDist = 0;
            for (let i = 0; i < pointsArray.length - 1; i++) {
                totalDist += calculateHaversineDistance(
                    pointsArray[i].lat, pointsArray[i].lon,
                    pointsArray[i + 1].lat, pointsArray[i + 1].lon
                );
            }
            document.getElementById('totalDistance').innerText = totalDist.toFixed(2) + " km";
        }

        function fixTrajectoryData() {
            if (rawPoints.length < 2) {
                alert("Minimal butuh 2 titik data untuk membersihkan glitch.");
                return;
            }
            let validPoints = [rawPoints[0]];
            for (let i = 1; i < rawPoints.length; i++) {
                const prev = validPoints[validPoints.length - 1];
                const curr = rawPoints[i];
                const dist = calculateHaversineDistance(prev.lat, prev.lon, curr.lat, curr.lon);
                const timeSec = (curr.timestamp - prev.timestamp) / 1000;
                const speedKmh = timeSec > 0 ? (dist / (timeSec / 3600)) : 0;

                if (speedKmh <= 120) {
                    validPoints.push(curr);
                }
            }
            polylineLayer.setStyle({ color: '#10b981', weight: 5 });
            renderPolylineAndDistance(validPoints);
            alert("Berhasil membersihkan loncatan GPS (glitch)!");
        }

        window.onload = initMap;
    </script>
</body>
</html>
